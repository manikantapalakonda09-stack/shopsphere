# ==============================================================================
# SHOPSPHERE - Enterprise Multi-Vendor Marketplace Configuration
# ==============================================================================

spring.application.name=shopsphere-backend
server.port=${PORT:10000}

# Database Configuration (MySQL - supports cloud env vars with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/shopsphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Optimization for Cloud (Render & Aiven)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
shopsphere.jwt.secret=${JWT_SECRET:shopsphereSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongEnterpriseMarketplace2026}
shopsphere.jwt.expiration-ms=86400000

# Platform Business Rules
shopsphere.marketplace.commission-percentage=10.0
shopsphere.marketplace.low-stock-threshold=5

# AI Service Configuration
shopsphere.ai.api-key=${GEMINI_API_KEY:}
shopsphere.ai.model=gemini-1.5-flash
