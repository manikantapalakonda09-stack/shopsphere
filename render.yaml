# ==============================================================================
# SHOPSPHERE - Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # Spring Boot Multi-Vendor Marketplace Backend
  - type: web
    name: shopsphere-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
